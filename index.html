<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor Pro v2</title>
  <!-- Declared, or the browser asks for /favicon.ico, gets a 404 and logs it
       as a console error on every fresh session. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Microsoft Clarity (marketing analytics). Not in the Windows app, which
       is served from app:// and loads nothing cross-origin. Once per window,
       where the editor is drawn: not in the tab host (it draws nothing), and
       of the tabs only in the first one (src/tabs/host.ts). -->
  <script type="text/javascript">
    var pdfQ = new URLSearchParams(location.search);
    var pdfHost = window.top === window && !pdfQ.has('single');
    var pdfTrack = location.protocol !== 'app:' && !pdfHost && (window.top === window || pdfQ.get('frame') === 't1');
    if (pdfTrack) (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yekabiqr31");
  </script>
  <!-- Netlify injects a "Powered by Netlify" badge iframe into served pages; keep it off the editor. -->
  <!-- Its HUD script (/.netlify/scripts/hud) names the frame nl-badge-frame or nl-hud-frame
       by variant; match every name and title it may use. -->
  <style>iframe[id^="nl-"], iframe[title*="Netlify"] { display: none !important; }</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
