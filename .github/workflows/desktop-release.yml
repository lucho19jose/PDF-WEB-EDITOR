# Builds the Windows installer and uploads it to a DRAFT GitHub Release.
#
# To release: bump "version" in package.json, commit, then
#   git tag v2.0.3 && git push origin v2.0.3
# and publish the draft on GitHub (Releases). Installed copies update
# themselves from the PUBLISHED release: electron-updater reads latest.yml
# from it. A draft is invisible to them, so a build can be tried first.
#
# electron-builder only BUILDS here (--publish never); the upload is its own
# step. Left to electron-builder, the v2.0.0-v2.0.2 runs succeeded and
# created no release at all, with nothing in the run to say why.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run electron:build
      - name: Upload the installer to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PDF Editor Pro ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
