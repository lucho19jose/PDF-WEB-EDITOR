# Builds the Windows installer and uploads it to a DRAFT GitHub Release.
#
# To release: bump "version" in package.json, commit, then
#   git tag v2.0.1 && git push origin v2.0.1
# and publish the draft on GitHub. Installed copies update themselves from the
# published release (electron-updater reads latest.yml from it).
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
